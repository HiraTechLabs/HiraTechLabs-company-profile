<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#fdf0a6" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf4d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.2" />
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#b8860b" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer subtle circular ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="100" cy="100" r="78" fill="url(#glowGrad)" opacity="0.35"/>
  
  <!-- 8-Point Luxury Geometric Star -->
  <g filter="url(#goldShadow)">
    <!-- Diagonal smaller star points -->
    <polygon points="100,35 116,84 165,100 116,116 100,165 84,116 35,100 84,84" 
             fill="url(#goldGrad)" />
    <!-- 45-degree rotated secondary star points -->
    <polygon points="100,50 112,88 150,100 112,112 100,150 88,112 50,100 88,88" 
             transform="rotate(45 100 100)" 
             fill="url(#goldGrad)" opacity="0.85" />
    <!-- Center bright diamond -->
    <polygon points="100,72 110,100 100,128 90,100" fill="#ffffff" opacity="0.9" />
    <polygon points="72,100 100,90 128,100 100,110" fill="#ffffff" opacity="0.9" />
    <circle cx="100" cy="100" r="4.5" fill="#ffffff" />
  </g>
</svg>
